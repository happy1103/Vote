<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>即時投票</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="page-shell">
    <header class="brand">
      <h1>即時投票</h1>
      <p>輸入場次代碼後加入投票</p>
    </header>

    <section id="joinPanel" class="panel">
      <div class="stack">
        <input id="roomCodeInput" type="text" inputmode="numeric" maxlength="6" placeholder="6 位數場次代碼" autocomplete="one-time-code" />
        <button id="joinBtn" class="btn">加入場次</button>
        <div id="joinError" class="small muted center"></div>
      </div>
    </section>

    <section id="roomPanel" class="hidden">
      <div class="panel center">
        <div class="small muted">場次代碼</div>
        <div id="roomCodeText" class="room-code"></div>
        <div id="roomStatus" class="status-pill"></div>
      </div>

      <div id="mainPanel" class="panel"></div>
      <div id="finalPanel" class="panel hidden"></div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script type="module" src="./voter.js"></script>
</body>
</html>
